# ─── Data directories ─────────────────────────────────────────────────────────
# Kizuna stores persistent data in bind-mounted directories alongside the project:
#   ./data/      — SQLite database (container: /data)
#   ./uploads/   — attachments, GIFs, backgrounds (container: /app/uploads)
#
# The container runs as UID 1000 (the "node" user). Make sure these directories
# are owned by UID 1000 on the host before starting:
#
#   mkdir -p data uploads && chown -R 1000:1000 data uploads
#
# ─── Migrating from named volumes (older versions) ────────────────────────────
# If you previously used Docker named volumes (kizuna_data, kizuna_uploads),
# run scripts/migrate-volumes.sh to copy your data before starting:
#
#   chmod +x scripts/migrate-volumes.sh && ./scripts/migrate-volumes.sh
#
# ─── Development / local builds ────────────────────────────────────────────────
# If you want to build the image locally instead of pulling from ghcr.io, use
# the dev override file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  kizuna:
    # KIZUNA_TAG (in .env) pins a release, e.g. KIZUNA_TAG=v0.2.0.
    # scripts/update.sh --pin <tag> writes it for you. Unset means :latest,
    # which only ever points at a stable release.
    image: ghcr.io/itsashn/kizuna:${KIZUNA_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    ports:
      # Media ports. UDP is the normal path; TCP is the fallback that mediasoup
      # advertises for clients whose network blocks UDP (there is no TURN
      # server), so the same range is published for both.
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}/udp"
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}/tcp"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:'+(process.env.SERVER_PORT||5000)+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      NODE_ENV: production
      # Caddy sits in front and overwrites X-Forwarded-For, so the server can
      # use it to rate-limit per client. Set to false if you remove Caddy and
      # expose the server directly, or clients can spoof their IP.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SERVER_PORT: ${SERVER_PORT:-5000}
      SERVER_NAME: ${SERVER_NAME:-Kizuna Server}
      SERVER_DESCRIPTION: ${SERVER_DESCRIPTION:-A self-hosted Kizuna community}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      SERVER_DB_PATH: /data/server.db
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-}
      RTC_MIN_PORT: ${RTC_MIN_PORT:-40000}
      RTC_MAX_PORT: ${RTC_MAX_PORT:-40099}
      MEDIASOUP_LOG_LEVEL: ${MEDIASOUP_LOG_LEVEL:-warn}
      IS_PUBLIC: ${IS_PUBLIC:-false}
      ANNOUNCE_URL: ${ANNOUNCE_URL:-}
      IS_REGISTRY: ${IS_REGISTRY:-false}
      SERVER_URL: ${SERVER_URL:-}
      UPNP_ENABLED: ${UPNP_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to your domain name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --cleanup --label-enable
    # Remove this service if you prefer to update manually.
    # Watchtower polls ghcr.io hourly and restarts kizuna when the tag it runs
    # gets a new image. With the default KIZUNA_TAG that is :latest, which the
    # release pipeline only moves for stable vX.Y.Z releases after CI passes,
    # never for -rc/-beta prereleases. A pinned version tag never changes, so
    # pinning effectively turns Watchtower off for kizuna.

volumes:
  caddy_data:
  caddy_config:
