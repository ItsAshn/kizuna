name: Release Android

# Signed AAB for Google Play.
#
# A `v*` tag (v1.2.3) uploads a draft release to the closed testing track
# (`alpha`), whose testers are the Google Group behind "Test the Android app" on
# the landing page; roll it out, and later promote it to production, in Play
# Console. A build uploaded to one track can't be uploaded to another (its
# versionCode is taken), so tags never go to internal testing. Run by hand with
# track "none" to get a signed AAB without uploading.
#
# The APK for sideloading is still built by release.yml and attached to the
# GitHub release.
#
# Secrets:
#   ANDROID_KEYSTORE_BASE64     upload keystore, base64
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias in the keystore
#   ANDROID_KEY_PASSWORD        key password
#   PLAY_SERVICE_ACCOUNT_JSON   Google Cloud service account key with release rights
#                               in Play Console (only needed to upload)
#
# Versions: Tauri turns v1.2.3 into versionName "1.2.3" and versionCode 1002003
# (major × 1,000,000 + minor × 1,000 + patch). Play rejects a versionCode it has
# seen, so every upload needs a new tag. Manual runs without a tag use the version
# in tauri.conf.json.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

env:
  TRACK: ${{ inputs.track || 'alpha' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 platform-tools ndk;27.2.12479018 build-tools;35.0.1'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          fi
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "version \"$name\" is not MAJOR.MINOR.PATCH"; exit 1; }
          jq --arg v "$name" '.version = $v' apps/desktop/src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp apps/desktop/src-tauri/tauri.conf.json
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "versionName $name"

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          keystore="$RUNNER_TEMP/upload.keystore"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # The Gradle release build type signs with ANDROID_KEYSTORE_FILE.
      - name: Build AAB
        working-directory: apps/desktop
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --aab

      - name: Collect
        run: |
          aab=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/bundle -name '*release*.aab' | head -n 1)
          test -n "$aab" || { echo "no AAB built"; exit 1; }
          jarsigner -verify "$aab" | grep -q "jar verified" || { echo "AAB is not signed"; exit 1; }
          mkdir -p release
          cp "$aab" "release/kizuna-$VERSION_NAME.aab"
          rm "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: kizuna-android-${{ env.VERSION_NAME }}
          path: release/*.aab
          if-no-files-found: error

      - name: Upload to Google Play
        if: env.TRACK != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kizuna.desktop
          releaseFiles: release/*.aab
          track: ${{ env.TRACK }}
          # The internal track takes builds straight away; other tracks need the
          # app to have passed review once, so start them as drafts there.
          status: ${{ env.TRACK == 'internal' && 'completed' || 'draft' }}
