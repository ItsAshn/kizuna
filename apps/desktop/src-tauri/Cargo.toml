[package]
name = "kizuna"
version = "0.27.0"
description = "Kizuna Desktop Client"
authors = ["ItsAshn"]
edition = "2021"

[lib]
name = "kizuna_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

libc = "0.2"
bytemuck = "1"
once_cell = "1"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.9"
ashpd = { version = "0.13", features = ["screencast", "tokio"] }
# WebKitGTK ships WebRTC support but leaves it off by default, so wry's webview
# has no RTCPeerConnection. We flip the setting on at startup (see lib.rs).
webkit2gtk = { version = "2.0", features = ["v2_38"] }
# Screenshare is VP8-encoded natively because the webview cannot do it (see
# voice/video.rs). GStreamer is already required by WebKitGTK, so this adds no
# runtime dependency users don't already have.
gstreamer = "0.25"
gstreamer-app = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
x-win = "5"
cpal = "0.17"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
openssl-probe = "0.1"
webrtc = "0.17"
opus2 = "0.4"
bytes = "1"
nnnoiseless = "0.4"
ringbuf = "0.5"
nokhwa = "0.10"

# Acoustic echo cancellation (AEC3). `bundled` compiles and statically links
# WebRTC's audio processing module, so users need no extra runtime library and
# no distro is left without echo cancellation. Costs ~40s on a cold 4-core
# build and nothing on a warm one.
#
# Windows is excluded because webrtc-audio-processing-sys 2.1.0 does not build
# with MSVC — build.rs passes GCC-only flags (`-Wno-unused-parameter`), expects
# `.a` archives, and prefixes symbols with rust-objcopy. voice/aec.rs falls back
# to a stub there. Lifting this means porting the -sys crate, ideally upstream.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "windows")))'.dependencies]
webrtc-audio-processing = { version = "2", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
